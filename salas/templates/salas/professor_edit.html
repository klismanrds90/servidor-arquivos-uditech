<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Professor - {{ professor.username }}</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #1f2937; }
        .container { max-width: 720px; margin: 40px auto; padding: 24px; }
        .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08); }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; }
        button { background: #2563eb; color: white; border: none; border-radius: 8px; padding: 10px 16px; cursor: pointer; font-weight: 600; }
        .warning { color: #dc2626; margin-top: 8px; }
        a { color: #2563eb; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Editar Professor</h1>
            <p>Atualize os dados do professor <strong>{{ professor.username }}</strong>.</p>
            {% if error %}<div class="warning">{{ error }}</div>{% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input id="username" name="username" value="{{ professor.username }}" required>
                </div>
                <div class="form-group">
                    <label for="password">Nova senha (opcional)</label>
                    <input id="password" name="password" type="password" placeholder="Deixe em branco para manter a senha atual">
                </div>
                <div style="display:flex; gap:8px; margin-top:12px;">
                    <button type="submit">Salvar</button>
                    <a href="{% url 'admin_dashboard' %}">Voltar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
